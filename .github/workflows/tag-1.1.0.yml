name: Create tag 1.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tag-1.1.0.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag
        shell: bash
        env:
          TARGET_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/1.1.0" >/dev/null; then
            echo "Tag 1.1.0 already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a 1.1.0 "$TARGET_SHA" -m "tvbox 1.1.0"
          git push origin refs/tags/1.1.0
